[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anaf"
version = "0.1.0"
description = "AntiNoise Adaptive Time-Frequency Fusion for multivariate time-series anomaly detection"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sizhe Huang" }]
keywords = ["anomaly-detection", "time-series", "pytorch", "wavelet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "PyWavelets>=1.8,<2",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.12,<2",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
anaf = "anaf.cli:main"

[project.urls]
Paper = "https://doi.org/10.1016/j.engappai.2026.114584"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
